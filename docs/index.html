<!DOCTYPE html>
<html>
<head>
    <title>CAD Archive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/global.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>3D CAD Blueprint Archive</h1>
        <div class="card">
            <div class="card-body">
                <h3>Upload CAD Model</h3>
                
                <!-- Update this with your actual backend domain -->
                <form action="https://your-backend-app-name.onrender.com/upload" method="post" enctype="multipart/form-data"> 
                    <input class="form-control" type="file" name="file" accept=".step,.stl,.obj,.glb" required> 
                    <button class="btn btn-primary mt-3" type="submit"> Save Archive </button> 
                </form>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
