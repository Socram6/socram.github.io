<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Model Viewer (STL / OBJ)</title>
  <style>
    html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#111;color:#eee}
    #ui{position:fixed;left:12px;top:12px;z-index:10;background:rgba(0,0,0,0.5);padding:12px;border-radius:8px}
    #canvas-container{width:100%;height:100%}
    canvas{display:block}
    a.button{color:#fff;background:#1976d2;padding:6px 10px;border-radius:4px;text-decoration:none}
    p small{color:#ccc}
  </style>
</head>
<body>
  <div id="ui">
    <div>
      <label for="file">Select .stl or .obj file (local):</label><br>
      <input id="file" type="file" accept=".stl,.obj" />
    </div>
    <div style="margin-top:8px">
      <button id="reset">Reset View</button>
      <a class="button" id="help" href="#">Help</a>
    </div>
    <p style="margin-top:8px;max-width:280px;font-size:13px"><small>Tip: Use this to preview models locally (no backend). Use drag & drop or the file selector.</small></p>
  </div>

  <div id="canvas-container"></div>

  <!-- three.js and examples (non-module builds) -->
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.152.2/examples/js/loaders/STLLoader.js"></script>
  <script src="https://unpkg.com/three@0.152.2/examples/js/loaders/OBJLoader.js"></script>

  <script>
    // Basic three.js scene setup
    let scene, camera, renderer, controls, hemi, dirLight;
    let modelGroup;

    const container = document.getElementById('canvas-container');
    init();
    animate();

    function init(){
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111111);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 100);

      renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
      hemi.position.set(0, 200, 0);
      scene.add(hemi);

      dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(0, 200, 100);
      scene.add(dirLight);

      // grid and axes helper (small)
      const grid = new THREE.GridHelper(200, 20, 0x222222, 0x222222);
      grid.material.opacity = 0.15; grid.material.transparent = true;
      scene.add(grid);

      modelGroup = new THREE.Group();
      scene.add(modelGroup);

      window.addEventListener('resize', onWindowResize);

      // UI events
      document.getElementById('file').addEventListener('change', handleFileSelect);
      document.getElementById('reset').addEventListener('click', resetView);
      document.getElementById('help').addEventListener('click', (e)=>{e.preventDefault(); alert('Select a local .stl or .obj file. STL may be binary or ASCII. This viewer reads files locally via FileReader, so no server is required.');});

      // support drag & drop
      ['dragenter','dragover'].forEach(evt => window.addEventListener(evt, (e)=>{e.preventDefault();e.dataTransfer.dropEffect='copy'}));
      window.addEventListener('drop', onDrop);
    }

    function onWindowResize(){
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function resetView(){
      controls.target.set(0,0,0);
      camera.position.set(0,0,100);
      controls.update();
    }

    function clearModel(){
      while(modelGroup.children.length) {
        const c = modelGroup.children[0];
        c.geometry && c.geometry.dispose();
        c.material && c.material.dispose && c.material.dispose();
        modelGroup.remove(c);
      }
    }

    function handleFileSelect(evt){
      const file = evt.target.files && evt.target.files[0];
      if(!file) return;
      loadLocalFile(file);
    }

    function onDrop(e){
      e.preventDefault();
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if(f) loadLocalFile(f);
    }

    function loadLocalFile(file){
      clearModel();
      const name = file.name.toLowerCase();
      if(name.endsWith('.stl')){
        const reader = new FileReader();
        reader.onload = function(ev){
          try{
            const arrayBuffer = ev.target.result;
            const loader = new THREE.STLLoader();
            const geometry = loader.parse(arrayBuffer);
            geometry.computeVertexNormals();
            const material = new THREE.MeshStandardMaterial({color:0x8f8f8f, metalness:0.2, roughness:0.6});
            const mesh = new THREE.Mesh(geometry, material);
            finalizeMesh(mesh);
          }catch(err){
            alert('Failed to parse STL: '+err.message);
            console.error(err);
          }
        };
        reader.readAsArrayBuffer(file);
      } else if(name.endsWith('.obj')){
        const reader = new FileReader();
        reader.onload = function(ev){
          try{
            const text = ev.target.result;
            const loader = new THREE.OBJLoader();
            const obj = loader.parse(text);
            finalizeMesh(obj);
          }catch(err){
            alert('Failed to parse OBJ: '+err.message);
            console.error(err);
          }
        };
        reader.readAsText(file);
      } else {
        alert('Unsupported file type. Pick an .stl or .obj file.');
      }
    }

    function finalizeMesh(obj){
      // center and scale model
      const box = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      if(maxDim > 0){
        const scale = 60 / maxDim;
        obj.scale.set(scale,scale,scale);
      }
      box.setFromObject(obj);
      const center = new THREE.Vector3();
      box.getCenter(center);
      obj.position.sub(center); // center on origin

      modelGroup.add(obj);

      // fit camera
      const dist = Math.max(20, (obj.geometry ? obj.geometry.boundingSphere?.radius||10 : 30));
      camera.position.set(0, 0, Math.max(60, dist*2));
      controls.update();
    }

    function animate(){
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
